name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Monaco Editor'ü indir
        run: |
          mkdir -p /tmp/m && cd /tmp/m
          npm init -y >/dev/null
          npm install monaco-editor@0.52.2 --no-audit --no-fund
          dest="$GITHUB_WORKSPACE/app/src/main/assets/www/monaco"
          mkdir -p "$dest"
          cp -r node_modules/monaco-editor/min/vs "$dest/"
          test -f "$dest/vs/loader.js"
          du -sh "$dest"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı hazırla
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk KodEditor.apk
          unzip -l KodEditor.apk | grep -E "assets/www/(index.html|app.js|monaco/vs/loader.js)"
          ls -la KodEditor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KodEditor-apk
          path: KodEditor.apk

      - name: APK'yı "apk" dalına koy
        run: |
          mkdir /tmp/out && cp KodEditor.apk /tmp/out/ && cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add KodEditor.apk
          git commit -q -m "APK: ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
